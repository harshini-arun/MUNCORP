{% extends "layout.html" %}
{% block content %}
<div class="mb-4">
    <h3><i class="bi bi-speedometer2 me-2"></i>Citizen Dashboard</h3>
    <p class="text-muted">Welcome, {{ user_name }}. Select a service below.</p>
</div>

<div class="row g-3">
    {% for module in modules %}
    <div class="col-sm-6 col-lg-4">
        <a href="{{ module.url if module.url else url_for('citizen.module_placeholder', module_name=module.name.lower().replace(' ', '-')) }}"
           class="text-decoration-none">
            <div class="card module-card h-100 shadow-sm">
                <div class="card-body text-center py-4">
                    <i class="bi {{ module.icon }} fs-2 text-primary"></i>
                    <h6 class="mt-2 mb-0">{{ module.name }}</h6>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>

<div class="mt-4">
    <a href="{{ url_for('registration.my_registrations') }}" class="btn btn-outline-primary">
        <i class="bi bi-list-check me-1"></i>View My Registrations &amp; Applications
    </a>
</div>
{% endblock %}
