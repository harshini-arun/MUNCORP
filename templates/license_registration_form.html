{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-1"><i class="bi bi-card-checklist me-2"></i>License Registration</h4>
                <p class="text-muted">Fill in the details below. Status will be set to <strong>Pending</strong> until reviewed by an administrator.</p>

                <form method="POST" action="{{ url_for('registration.license_registration') }}" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Vehicle ID</label>
                        <input type="text" class="form-control" name="vehicle_id" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Citizen ID</label>
                        <input type="text" class="form-control" value="{{ session.get('userId') }}" disabled>
                        <div class="form-text">Automatically set to your logged-in Citizen ID.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Test ID</label>
                        <input type="text" class="form-control" name="test_id" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Renewal Date</label>
                        <input type="date" class="form-control" name="renewal_date" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>Submit
                        </button>
                        <a href="{{ url_for('citizen.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
