{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-1"><i class="bi bi-file-earmark-medical me-2"></i>Birth Registration</h4>
                <p class="text-muted">Fill in the details below. Status will be set to <strong>Pending</strong> until reviewed by an administrator.</p>

                <form method="POST" action="{{ url_for('registration.birth_registration') }}" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Child Name</label>
                        <input type="text" class="form-control" name="child_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parent Name</label>
                        <input type="text" class="form-control" name="parent_name"
                               value="{{ request.form.get('parent_name', session.get('userName', '')) }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parent Citizen ID</label>
                        <input type="text" class="form-control" name="parent_citizen_id"
                               value="{{ request.form.get('parent_citizen_id', session.get('userId', '')) }}" required>
                        <div class="form-text">Defaults to your Citizen ID — change it if you're filing on behalf of someone else.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Place of Birth</label>
                        <input type="text" class="form-control" name="place_of_birth" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Birth Date</label>
                            <input type="date" class="form-control" name="birth_date" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Birth Time</label>
                            <input type="time" class="form-control" name="birth_time" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Medical Certificate Code</label>
                        <input type="text" class="form-control" name="med_cert_code" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>Submit
                        </button>
                        <a href="{{ url_for('citizen.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
