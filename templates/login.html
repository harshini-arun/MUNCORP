{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm login-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock fs-1 text-primary"></i>
                    <h3 class="mt-2 mb-0">Portal Login</h3>
                    <p class="text-muted">Sign in to access your dashboard</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Login as</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="role" id="role-citizen" value="citizen" checked>
                            <label class="btn btn-outline-primary" for="role-citizen">
                                <i class="bi bi-person me-1"></i>Citizen
                            </label>

                            <input type="radio" class="btn-check" name="role" id="role-admin" value="admin">
                            <label class="btn btn-outline-primary" for="role-admin">
                                <i class="bi bi-person-badge me-1"></i>Administrator
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="user_id" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="user_id" name="user_id"
                               placeholder="Enter your Citizen / Admin ID" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </button>
                </form>

                <p class="text-center text-muted small mt-3 mb-0">
                    
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
